version: '3.8'

networks:
  lendguard-public-net:
    driver: bridge
  lendguard-internal-net:
    driver: bridge
    internal: true

volumes:
  staging_postgres_data:
  staging_app_storage:

services:
  postgres:
    image: postgres:16-alpine
    container_name: lendguard-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_DB_NAME:-lendguard_staging}
      POSTGRES_USER: ${STAGING_DB_USER:-lendguard_app}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Database password must be provided}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - lendguard-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USER:-lendguard_app} -d ${STAGING_DB_NAME:-lendguard_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lendguard-staging-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      AI_SERVICE_KEY: ${STAGING_AI_SERVICE_KEY:?AI Service Secret Key must be set}
      LLM_PROVIDER: ${STAGING_LLM_PROVIDER:-mock}
      LLM_API_KEY: ${STAGING_LLM_API_KEY:-staging_key}
      LLM_MODEL: ${STAGING_LLM_MODEL:-gpt-4o-mini}
    networks:
      - lendguard-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/internal/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  backend-api:
    build:
      context: .
      dockerfile: backend/LendGuard.Api/Dockerfile
    container_name: lendguard-staging-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      REQUIRE_HTTPS: "true"
      SEED_TEST_USERS: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${STAGING_DB_NAME:-lendguard_staging};Username=${STAGING_DB_USER:-lendguard_app};Password=${STAGING_DB_PASSWORD}
      JWT_SECRET: ${STAGING_JWT_SECRET:?JWT Secret must be set}
      JWT_EXPIRY_MINUTES: ${STAGING_JWT_EXPIRY_MINUTES:-120}
      FILE_STORAGE_PATH: /var/lendguard/storage
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${STAGING_AI_SERVICE_KEY:?AI Service Secret Key must be set}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - staging_app_storage:/var/lendguard/storage
    networks:
      - lendguard-internal-net
      - lendguard-public-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  backend-worker:
    build:
      context: .
      dockerfile: backend/LendGuard.Worker/Dockerfile
    container_name: lendguard-staging-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${STAGING_DB_NAME:-lendguard_staging};Username=${STAGING_DB_USER:-lendguard_app};Password=${STAGING_DB_PASSWORD}
      FILE_STORAGE_PATH: /var/lendguard/storage
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${STAGING_AI_SERVICE_KEY:?AI Service Secret Key must be set}
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    volumes:
      - staging_app_storage:/var/lendguard/storage
    networks:
      - lendguard-internal-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: lendguard-staging-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/var/www/frontend:ro
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - lendguard-public-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
